# ai-skills-policy-profile: trusted-ci
name: Lock Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lock-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  generate-locks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned lock generator
        run: python -m pip install "pip-tools==7.6.0"
      - name: Generate exact-wheel runtime and development locks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lock-preview/full lock-preview/wheels/runtime lock-preview/wheels/dev
          PYTAG="$(python -c 'import sys; print(f"py{sys.version_info.major}{sys.version_info.minor}")')"
          pip-compile pyproject.toml \
            --generate-hashes \
            --resolver=backtracking \
            --allow-unsafe \
            --strip-extras \
            --output-file "lock-preview/full/runtime.lock"
          pip-compile pyproject.toml \
            --extra dev \
            --generate-hashes \
            --resolver=backtracking \
            --allow-unsafe \
            --strip-extras \
            --output-file "lock-preview/full/dev.lock"
          python -m pip download \
            --only-binary=:all: \
            --require-hashes \
            --dest lock-preview/wheels/runtime \
            -r lock-preview/full/runtime.lock
          python -m pip download \
            --only-binary=:all: \
            --require-hashes \
            --dest lock-preview/wheels/dev \
            -r lock-preview/full/dev.lock
          python - "$PYTAG" <<'PY'
          from __future__ import annotations

          import hashlib
          import sys
          from pathlib import Path

          from packaging.utils import canonicalize_name, parse_wheel_filename

          pytag = sys.argv[1]
          for kind in ("runtime", "dev"):
              wheel_dir = Path("lock-preview/wheels") / kind
              records: dict[str, tuple[str, str]] = {}
              for wheel in sorted(wheel_dir.glob("*.whl")):
                  name, version, _build, _tags = parse_wheel_filename(wheel.name)
                  normalized = canonicalize_name(name)
                  if normalized in records:
                      raise SystemExit(f"duplicate wheel for {normalized}: {wheel}")
                  digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
                  records[normalized] = (str(version), digest)
              if not records:
                  raise SystemExit(f"no wheels resolved for {kind}")
              output = Path("lock-preview") / f"{kind}-linux-x64-{pytag}.lock"
              lines = [
                  f"# Exact Linux x64 wheel lock generated on Python {pytag[2]}.{pytag[3:]}",
                  "# Install with: python -m pip install --only-binary=:all: --require-hashes -r <this-file>",
                  "",
              ]
              lines.extend(
                  f"{name}=={version} --hash=sha256:{digest}"
                  for name, (version, digest) in sorted(records.items())
              )
              output.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          python -m pip install \
            --dry-run --only-binary=:all: --require-hashes \
            -r "lock-preview/runtime-linux-x64-${PYTAG}.lock"
          python -m pip install \
            --dry-run --only-binary=:all: --require-hashes \
            -r "lock-preview/dev-linux-x64-${PYTAG}.lock"
      - name: Upload lock preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-lock-preview-${{ matrix.python }}
          path: lock-preview/*.lock
          if-no-files-found: error
          retention-days: 7
