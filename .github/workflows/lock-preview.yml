# ai-skills-policy-profile: trusted-ci
name: Lock Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lock-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  generate-locks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned lock generator
        run: python -m pip install "pip-tools==7.6.0"
      - name: Generate hashed runtime and development locks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lock-preview
          PYTAG="$(python -c 'import sys; print(f"py{sys.version_info.major}{sys.version_info.minor}")')"
          pip-compile pyproject.toml \
            --generate-hashes \
            --resolver=backtracking \
            --allow-unsafe \
            --strip-extras \
            --output-file "lock-preview/runtime-linux-x64-${PYTAG}.lock"
          pip-compile pyproject.toml \
            --extra dev \
            --generate-hashes \
            --resolver=backtracking \
            --allow-unsafe \
            --strip-extras \
            --output-file "lock-preview/dev-linux-x64-${PYTAG}.lock"
          python -m pip install --dry-run --require-hashes -r "lock-preview/runtime-linux-x64-${PYTAG}.lock"
          python -m pip install --dry-run --require-hashes -r "lock-preview/dev-linux-x64-${PYTAG}.lock"
      - name: Upload lock preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-lock-preview-${{ matrix.python }}
          path: lock-preview/*.lock
          if-no-files-found: error
          retention-days: 7
