name: Promote tested container image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  promote:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Download exact tested wheel
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$RUN_ID" --name "release-bundle-$HEAD_SHA" --dir dist
          sha256sum --check dist/SHA256SUMS
      - name: Build and smoke local image
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          SHORT="${HEAD_SHA:0:12}"
          docker build -t "$IMAGE:sha-$SHORT" -t "$IMAGE:latest" .
          docker run --rm --entrypoint python "$IMAGE:sha-$SHORT" -c "import kontomierz_mcp; print(kontomierz_mcp.__version__)"
      - name: Push the same local image
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          IMAGE: ghcr.io/${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT="${HEAD_SHA:0:12}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:sha-$SHORT"
          docker push "$IMAGE:latest"
