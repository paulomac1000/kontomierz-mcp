name: Promote tested container image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  promote:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 20
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - name: Download exact tested release bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$RUN_ID" --name "release-bundle-$HEAD_SHA" --dir dist
          sha256sum --check dist/SHA256SUMS
      - name: Verify build provenance for the image archive
        run: |
          set -euo pipefail
          gh attestation verify dist/kontomierz-mcp-image.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --bundle dist/build-provenance.jsonl \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
            --source-digest "$HEAD_SHA"
      - name: Load and smoke the exact tested image
        run: |
          set -euo pipefail
          gzip -dc dist/kontomierz-mcp-image.tar.gz | docker load
          docker run --rm --entrypoint python "kontomierz-mcp:$HEAD_SHA" -c \
            "import kontomierz_mcp; print(kontomierz_mcp.__version__)"
      - name: Push two tags for the same loaded image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT="${HEAD_SHA:0:12}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "kontomierz-mcp:$HEAD_SHA" "$IMAGE:sha-$SHORT"
          docker tag "kontomierz-mcp:$HEAD_SHA" "$IMAGE:latest"
          docker push "$IMAGE:sha-$SHORT"
          docker push "$IMAGE:latest"
      - name: Verify registry digests
        id: digest
        run: |
          set -euo pipefail
          SHORT="${HEAD_SHA:0:12}"
          SHA_DIGEST="$(docker buildx imagetools inspect "$IMAGE:sha-$SHORT" | awk '$1 == "Digest:" {print $2; exit}')"
          LATEST_DIGEST="$(docker buildx imagetools inspect "$IMAGE:latest" | awk '$1 == "Digest:" {print $2; exit}')"
          test -n "$SHA_DIGEST"
          test "$SHA_DIGEST" = "$LATEST_DIGEST"
          echo "digest=$SHA_DIGEST" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$IMAGE@$SHA_DIGEST" | tee IMAGE_DIGEST
      - name: Attest promotion of the CI-tested image
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          predicate-type: https://kontomierz-mcp.dev/attestations/image-promotion/v1
          predicate: |
            {
              "source_repository": "${{ github.repository }}",
              "source_revision": "${{ env.HEAD_SHA }}",
              "source_workflow_run_id": "${{ github.event.workflow_run.id }}",
              "promotion_environment": "release",
              "statement": "Promoted unchanged from the exact CI-tested image archive"
            }
          push-to-registry: true
          create-storage-record: false
      - name: Upload promotion evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: promotion-evidence-${{ env.HEAD_SHA }}
          path: |
            IMAGE_DIGEST
            ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 90
