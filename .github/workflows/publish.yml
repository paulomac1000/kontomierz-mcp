# ai-skills-policy-profile: protected-release
name: Publish tested image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
  SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
  IMAGE: ghcr.io/${{ github.repository_owner }}/kontomierz-mcp

jobs:
  verify-artifact:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted default branch for ancestry proof
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove release SHA is reachable from trusted default branch
        run: |
          set -euo pipefail
          git cat-file -e "$HEAD_SHA^{commit}"
          git merge-base --is-ancestor "$HEAD_SHA" HEAD
      - name: Download closed release bundle from successful CI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          name: release-bundle-${{ env.HEAD_SHA }}
          path: dist
      - name: Verify archive identity without executing candidate content
        run: |
          set -euo pipefail
          test "$HEAD_SHA" = "${{ github.event.workflow_run.head_sha }}"
          (cd dist && sha256sum --check SHA256SUMS)
          (cd dist && sha256sum --check RELEASE_SHA256SUMS)
          python - "$HEAD_SHA" <<'PY'
          import json
          import sys
          metadata = json.load(open("dist/IMAGE_METADATA.json", encoding="utf-8"))
          if metadata.get("source_sha") != sys.argv[1]:
              raise SystemExit("release artifact source SHA mismatch")
          PY

  publish:
    needs: verify-artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Download already-verified closed release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          name: release-bundle-${{ env.HEAD_SHA }}
          path: dist
      - name: Re-verify archive before promotion
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS)
          (cd dist && sha256sum --check RELEASE_SHA256SUMS)
          python - "$HEAD_SHA" <<'PY'
          import json
          import sys
          metadata = json.load(open("dist/IMAGE_METADATA.json", encoding="utf-8"))
          if metadata.get("source_sha") != sys.argv[1]:
              raise SystemExit("release artifact source SHA mismatch")
          PY
      - name: Load exact CI-tested image without running it
        run: gzip -dc dist/kontomierz-mcp-image.tar.gz | docker load
      - name: Authenticate registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Promote immutable and convenience tags
        run: |
          set -euo pipefail
          SOURCE="kontomierz-mcp:$HEAD_SHA"
          SHA_TAG="$IMAGE:sha-$HEAD_SHA"
          LATEST_TAG="$IMAGE:latest"
          docker tag "$SOURCE" "$SHA_TAG"
          docker tag "$SOURCE" "$LATEST_TAG"
          docker push "$SHA_TAG"
          docker push "$LATEST_TAG"
      - name: Verify promoted tags resolve to one digest
        id: digest
        run: |
          set -euo pipefail
          SHA_DIGEST="$(docker buildx imagetools inspect "$IMAGE:sha-$HEAD_SHA" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          LATEST_DIGEST="$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test -n "$SHA_DIGEST"
          test "$SHA_DIGEST" = "$LATEST_DIGEST"
          echo "digest=$SHA_DIGEST" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$IMAGE@$SHA_DIGEST" | tee IMAGE_DIGEST
      - name: Attest promotion of the CI-tested image
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          predicate-type: https://kontomierz-mcp.dev/attestations/image-promotion/v1
          predicate: |
            {
              "source_repository": "${{ github.repository }}",
              "source_revision": "${{ env.HEAD_SHA }}",
              "source_workflow_run_id": "${{ env.SOURCE_RUN_ID }}",
              "artifact": "release-bundle-${{ env.HEAD_SHA }}"
            }
      - name: Upload promotion evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: promotion-evidence-${{ env.HEAD_SHA }}
          path: |
            IMAGE_DIGEST
            ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 90
