name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project quality environment
        run: python -m pip install -e ".[dev]"
      - name: Verify checkout identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Mypy
        run: python -m mypy src/kontomierz_mcp
      - name: Bandit
        run: python -m bandit -q -r src/kontomierz_mcp
      - name: Dependency audit
        run: python -m pip_audit
      - name: Test with branch coverage
        run: >-
          python -m pytest -m "not external"
          --cov=kontomierz_mcp --cov-branch
          --cov-report=term-missing --cov-report=xml
      - name: Mock all-tools smoke
        run: python scripts/mock_smoke.py
      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quality-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 30

  compatibility:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -m "not external" -q

  exact-artifact:
    needs: [quality, compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build wheel and resolve one runtime wheelhouse
        run: |
          set -euo pipefail
          python -m pip install build
          python -m build --wheel
          mkdir -p dist/wheelhouse
          python -m pip download --dest dist/wheelhouse dist/kontomierz_mcp-*.whl
          find dist -type f -name '*.whl' -print0 | sort -z | xargs -0 sha256sum | tee dist/SHA256SUMS
      - name: Test the exact wheel in isolation
        run: |
          set -euo pipefail
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/python -m pip install --no-index \
            --find-links=dist/wheelhouse dist/kontomierz_mcp-*.whl
          /tmp/wheel-venv/bin/python -m pip install pytest pytest-asyncio pytest-cov
          /tmp/wheel-venv/bin/python -m pytest -m "not external" -q
          /tmp/wheel-venv/bin/python scripts/transport_smoke.py stdio \
            --executable /tmp/wheel-venv/bin/kontomierz-mcp
          /tmp/wheel-venv/bin/python scripts/transport_smoke.py streamable-http \
            --executable /tmp/wheel-venv/bin/kontomierz-mcp
          /tmp/wheel-venv/bin/python - <<'PY'
          import pathlib
          import kontomierz_mcp
          source = pathlib.Path(kontomierz_mcp.__file__).resolve()
          assert "/tmp/wheel-venv/" in str(source), source
          print(source)
          PY
      - name: Build and smoke image from the same wheel
        run: |
          docker build -t kontomierz-mcp:${{ github.sha }} .
          docker run --rm --entrypoint python kontomierz-mcp:${{ github.sha }} -c \
            "from kontomierz_mcp.config import Settings; print(Settings(api_key='', mock_data=True))"
      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-bundle-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/*.whl
            dist/wheelhouse/*.whl
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
