# ai-skills-policy-profile: trusted-ci
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  AI_SKILLS_REV: c6dc6b13b2dd40b6e087140cd071b45067d75b39

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"
      - name: Install hash-locked project quality environment
        run: |
          set -euo pipefail
          python -m pip install --no-deps --only-binary=:all: --require-hashes \
            -r requirements/dev-linux-x64-py312.lock
          python -m pip install --no-deps --only-binary=:all: --require-hashes \
            -r requirements/build-linux-x64.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Verify installed dependency graph
        run: python -m pip check
      - name: Verify checkout identity
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Mypy
        run: python -m mypy src/kontomierz_mcp
      - name: Bandit
        run: python -m bandit -q -r src/kontomierz_mcp
      - name: Dependency audit
        run: python -m pip_audit
      - name: Test with branch coverage
        run: >-
          python -m pytest -m "not external"
          --cov=kontomierz_mcp --cov-branch --cov-report=term-missing
          --cov-report=xml --junitxml=pytest-junit.xml
      - name: Mock all-tools smoke
        run: python scripts/mock_smoke.py
      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quality-evidence-${{ env.CANDIDATE_SHA }}
          path: |
            coverage.xml
            pytest-junit.xml
            requirements/*.lock
          if-no-files-found: warn
          retention-days: 14

  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install lane-specific hash-locked development graph
        shell: bash
        run: |
          set -euo pipefail
          PYTAG="$(python -c 'import sys; print(f"py{sys.version_info.major}{sys.version_info.minor}")')"
          python -m pip install --no-deps --only-binary=:all: --require-hashes \
            -r "requirements/dev-linux-x64-${PYTAG}.lock"
          python -m pip install --no-deps --only-binary=:all: --require-hashes \
            -r requirements/build-linux-x64.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: python -m pytest -m "not external" -q

  standards:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Checkout trusted ai-skills validators
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: paulomac1000/ai-skills
          ref: ${{ env.AI_SKILLS_REV }}
          path: .trusted-ai-skills
          persist-credentials: false
      - name: Move trusted verifier outside candidate tree
        run: |
          rm -rf /tmp/trusted-ai-skills
          mv .trusted-ai-skills /tmp/trusted-ai-skills
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"
      - name: Install trusted validator lock
        run: >-
          python -m pip install
          --only-binary=:all:
          --require-hashes
          -r /tmp/trusted-ai-skills/requirements/validators.lock
      - name: Validate governed documents with trusted AFDS validator
        run: python /tmp/trusted-ai-skills/skills/afds-standard/scripts/validate_afds.py .
      - name: Audit AGENTS instructions from trusted revision
        run: >-
          python /tmp/trusted-ai-skills/skills/agents-md-standard/scripts/audit_agents_instructions.py
          . --ci-mode
      - name: Audit workflows from trusted revision
        run: >-
          python /tmp/trusted-ai-skills/skills/ci-cd/scripts/audit_workflows.py
          --repo-root .
          --policy .github/workflow-policy.yaml

  exact-artifact:
    needs: [quality, compatibility, standards]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"
      - name: Install hash-locked build environment
        run: |
          set -euo pipefail
          python -m pip install --no-deps --only-binary=:all: --require-hashes \
            -r requirements/dev-linux-x64-py312.lock
          python -m pip install --no-deps --only-binary=:all: --require-hashes \
            -r requirements/build-linux-x64.lock
      - name: Build exact application wheel
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          rm -rf dist build src/*.egg-info
          python -m pip wheel --no-deps --no-build-isolation . --wheel-dir dist
          test "$(find dist -maxdepth 1 -type f -name 'kontomierz_mcp-*.whl' | wc -l)" -eq 1
      - name: Materialize hash-locked runtime wheelhouse
        run: |
          mkdir -p dist/wheelhouse
          python -m pip download \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            --dest dist/wheelhouse \
            -r requirements/runtime-linux-x64-py312.lock
          (
            cd dist
            find . -type f -name '*.whl' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
      - name: Install exact wheel without network
        run: |
          rm -rf .artifact-venv /tmp/kontomierz-wheel-test
          python -m venv .artifact-venv
          .artifact-venv/bin/python -m pip install \
            --no-index \
            --find-links dist/wheelhouse \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            -r requirements/runtime-linux-x64-py312.lock
          .artifact-venv/bin/python -m pip install --no-index --no-deps dist/kontomierz_mcp-*.whl
          .artifact-venv/bin/python -m pip check
          mkdir -p /tmp/kontomierz-wheel-test
          cp -R tests scripts pyproject.toml /tmp/kontomierz-wheel-test/
          (
            cd /tmp/kontomierz-wheel-test
            "$GITHUB_WORKSPACE/.artifact-venv/bin/python" -m pytest -m "not external" -q
          )
          .artifact-venv/bin/python scripts/mock_smoke.py
      - name: Official Client stdio smoke from exact wheel
        run: >-
          .artifact-venv/bin/python scripts/transport_smoke.py stdio
          --executable .artifact-venv/bin/kontomierz-mcp
      - name: Official Client authenticated HTTP smoke from exact wheel
        run: >-
          .artifact-venv/bin/python scripts/transport_smoke.py streamable-http
          --executable .artifact-venv/bin/kontomierz-mcp
      - name: Build and smoke image from exact wheel
        run: |
          docker build -t "kontomierz-mcp:${SOURCE_SHA}" .
          docker run --rm "kontomierz-mcp:${SOURCE_SHA}" python -c \
            "import os, kontomierz_mcp; assert os.geteuid() != 0; print(kontomierz_mcp.__version__)"
          docker save "kontomierz-mcp:${SOURCE_SHA}" | gzip -n > dist/kontomierz-mcp-image.tar.gz
      - name: Close release artifact set
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          (
            cd dist
            find . -maxdepth 1 -type f \( -name '*.whl' -o -name 'kontomierz-mcp-image.tar.gz' \) \
              -print0 | sort -z | xargs -0 sha256sum > RELEASE_SHA256SUMS
          )
          cp requirements/runtime-linux-x64-py312.lock dist/
          cp requirements/build-linux-x64.lock dist/
          cat > dist/BUILD_METADATA <<EOF
          SOURCE_SHA=${SOURCE_SHA}
          PYTHON_VERSION=3.12
          RUNTIME_LOCK=requirements/runtime-linux-x64-py312.lock
          BUILD_LOCK=requirements/build-linux-x64.lock
          EOF
      - name: Upload exact closed release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-bundle-${{ env.SOURCE_SHA }}
          path: |
            dist/kontomierz_mcp-*.whl
            dist/wheelhouse/
            dist/kontomierz-mcp-image.tar.gz
            dist/SHA256SUMS
            dist/RELEASE_SHA256SUMS
            dist/BUILD_METADATA
            dist/runtime-linux-x64-py312.lock
            dist/build-linux-x64.lock
          if-no-files-found: error
          retention-days: 30
