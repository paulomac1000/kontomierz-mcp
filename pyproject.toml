[project]
name = "kontomierz-mcp"
version = "2.0.0"
description = "Loopback-first MCP server for the Kontomierz personal-finance API"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "httpx>=0.27,<1",
  "mcp==2.0.0",
  "pydantic>=2,<3",
  "starlette>=1.3.1,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<8",
  "ruff>=0.6",
  "mypy>=1.11",
  "bandit>=1.8",
  "build>=1.2,<2",
  "pip-audit>=2.7,<3",
]

[project.scripts]
kontomierz-mcp = "kontomierz_mcp.server:main"

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.mypy]
strict = true
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_decorators = false
follow_untyped_imports = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = '-m "not external"'
markers = [
  "unit: deterministic unit tests",
  "integration: multi-component tests with the in-memory backend",
  "sdk: requires the official MCP SDK",
  "external: requires disposable real-system or provider/repository evidence and is excluded by default",
  "evidence: requires provider/repository administration or independent review",
]

[tool.coverage.run]
source = ["src/kontomierz_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
